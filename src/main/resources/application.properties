spring.application.name=dispatch-load-balancer

# In-memory H2 (swap the URL for a file/Postgres DB without code changes)
spring.datasource.url=jdbc:h2:mem:dispatchdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate - batch writes for efficient bulk upserts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Large payloads are expected (thousands of orders)
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-form-post-size=20MB

server.port=${PORT:8080}
server.forward-headers-strategy=framework
